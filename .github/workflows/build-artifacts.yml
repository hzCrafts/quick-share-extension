name: Build & Bundle Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      - name: Run tests
        run: pnpm test

      - name: Bundle Extension (Chrome & Firefox)
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quick-share-extension-zips
          path: .output/*.zip
          retention-days: 30
